name: Team leave digest

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Preview validates only; live updates the sheet and posts
        type: choice
        options: [preview, live]
        default: preview
  schedule:
    # GitHub delays or drops scheduled runs, worst at the top of the hour, so no cron uses :00 or :30.
    # Primary run 05:57 UTC = 11:27 IST, so a typical few-minute delay lands it at about 11:30 IST.
    # The backup 06:23 UTC = 11:53 IST is harmless when the primary worked: today's digest is already
    # accepted, so it skips.
    - cron: '57 5 * * 1-5'
    - cron: '23 6 * * 1-5'
    # 07:17 UTC = 12:47 IST: read-only check that today's digest was accepted; alerts the owners if not.
    - cron: '17 7 * * 1-5'

permissions:
  contents: read

concurrency:
  group: team-leave-digest
  cancel-in-progress: false

jobs:
  digest:
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_SCHEDULE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Run digest (private data is never logged)
        id: digest
        run: python digest.py
        env:
          RUN_MODE: ${{ github.event_name == 'schedule' && (github.event.schedule == '17 7 * * 1-5' && 'verify' || 'live') || inputs.mode }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          SLACK_LEAVE_BOT_ID: ${{ secrets.SLACK_LEAVE_BOT_ID }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          TIMEZONE: ${{ vars.TIMEZONE || 'Asia/Kolkata' }}
          UPCOMING_DAYS: ${{ vars.UPCOMING_DAYS || '0' }}
          UPCOMING_MIN_DAYS: ${{ vars.UPCOMING_MIN_DAYS || '14' }}
          SKIP_WEEKENDS: ${{ vars.SKIP_WEEKENDS || 'true' }}
          SKIP_HOLIDAYS: ${{ vars.SKIP_HOLIDAYS || 'true' }}
          SLACK_LOOKBACK_DAYS: ${{ vars.SLACK_LOOKBACK_DAYS || '90' }}
          CALENDAR_MAX_ROWS: ${{ vars.CALENDAR_MAX_ROWS || '500' }}
      # Backstop for failures before digest.py could alert (install, tests, crash, timeout/cancel).
      - name: Alert owners on early failure
        if: always() && steps.digest.outcome != 'success' && (github.event_name == 'schedule' || inputs.mode == 'live') && steps.digest.outputs.alerted != 'true'
        continue-on-error: true
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          card = {"type": "AdaptiveCard", "version": "1.4", "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                  "body": [{"type": "TextBlock", "weight": "Bolder", "wrap": True, "text": "Leave digest NOT sent"},
                           {"type": "TextBlock", "wrap": True, "text": "The job failed or was stopped before it finished. The digest may or may not have reached leadership: check the leadership channel and the Digest State tab before re-running."}],
                  "actions": [{"type": "Action.OpenUrl", "title": "View run", "url": os.environ["RUN_URL"]}]}
          body = {"type": "message", "attachments": [{"contentType": "application/vnd.microsoft.card.adaptive", "contentUrl": None, "content": card}]}
          req = urllib.request.Request(os.environ["ALERT_WEBHOOK_URL"], json.dumps(body).encode(), {"Content-Type": "application/json"})
          urllib.request.urlopen(req, timeout=15)
          PY
