name: Team leave digest

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Preview validates; setup-mapping creates the mapping tab; live updates and posts
        type: choice
        options: [preview, setup-mapping, live]
        default: preview
  schedule:
    # 06:37 UTC = 12:07 IST. GitHub may delay scheduled runs.
    - cron: '37 6 * * 1-5'

permissions:
  contents: read

concurrency:
  group: team-leave-digest
  cancel-in-progress: false

jobs:
  digest:
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_SCHEDULE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Run digest (private data is never logged)
        run: python digest.py
        env:
          RUN_MODE: ${{ github.event_name == 'schedule' && 'live' || inputs.mode }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          SLACK_LEAVE_BOT_ID: ${{ secrets.SLACK_LEAVE_BOT_ID }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          TIMEZONE: ${{ vars.TIMEZONE || 'Asia/Kolkata' }}
          UPCOMING_DAYS: ${{ vars.UPCOMING_DAYS || '0' }}
          SKIP_WEEKENDS: ${{ vars.SKIP_WEEKENDS || 'true' }}
          SKIP_HOLIDAYS: ${{ vars.SKIP_HOLIDAYS || 'true' }}
          SLACK_LOOKBACK_DAYS: ${{ vars.SLACK_LOOKBACK_DAYS || '90' }}
          CALENDAR_MAX_ROWS: ${{ vars.CALENDAR_MAX_ROWS || '500' }}
